name: Schema check
on:
  push:
    branches: [master]
  pull_request:

jobs:
  schemas-up-to-date:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Keep a copy of the committed schemas
        run: cp -r docs/schemas "$RUNNER_TEMP/committed_schemas"

      - name: Regenerate JSON Schemas from the code
        run: python scripts/export_schemas.py

      - name: Compare regenerated schemas with the committed ones
        shell: python
        run: |
          import os, pathlib, sys

          committed = pathlib.Path(os.environ["RUNNER_TEMP"]) / "committed_schemas"
          problems = []
          for new in sorted(pathlib.Path("docs/schemas").glob("*.json")):
              old = committed / new.name
              if not old.exists():
                  problems.append(f"{new} is new and not committed")
              # Compare line by line, so Windows vs Unix line endings don't count as changes.
              elif old.read_text(encoding="utf-8").splitlines() != new.read_text(encoding="utf-8").splitlines():
                  problems.append(f"{new} is out of date")

          if problems:
              print("\n".join(problems))
              print("::error title=Schemas out of date::docs/schemas does not match vde/models.py. "
                    "Run 'python scripts/export_schemas.py' and commit the files in docs/schemas.")
              sys.exit(1)
          print("docs/schemas matches the code.")
